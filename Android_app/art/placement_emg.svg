<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Front view of the right arm: shoulder at the top, trunk on the right. -->
  <rect x="172" y="-40" width="140" height="330" rx="44" fill="#1B2B2B" fill-opacity="0.05" stroke="none"/>
  <path d="M76,58 A42,42 0 0 1 160,58 L160,166 L150,260 L86,260 L76,166 Z" fill="#1B2B2B" fill-opacity="0.10" stroke="#1B2B2B" stroke-width="3" stroke-linejoin="round"/>
  <path d="M96,176 Q118,186 140,176" fill="none" stroke="#1B2B2B" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Biceps belly, with the direction of the muscle fibres (along the arm). -->
  <ellipse cx="118" cy="100" rx="28" ry="62" fill="#1B2B2B" fill-opacity="0.10" stroke="none"/>
  <line x1="105" y1="50" x2="105" y2="150" stroke="#1B2B2B" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
  <line x1="118" y1="44" x2="118" y2="156" stroke="#1B2B2B" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
  <line x1="131" y1="50" x2="131" y2="150" stroke="#1B2B2B" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
  <!-- MyoWare 2.0 board: MID electrode on the middle of the belly, END in line with the fibres. -->
  <rect x="98" y="80" width="40" height="64" rx="7" fill="#1B2B2B" fill-opacity="0.40" stroke="#1B2B2B" stroke-width="2.5"/>
  <circle cx="118" cy="100" r="9" fill="#1B2B2B" stroke="none"/>
  <circle cx="118" cy="125" r="9" fill="#1B2B2B" stroke="none"/>
  <!-- REF electrode on its lead, beside the muscle belly (MyoWare 2.0 Quick Start Guide). -->
  <path d="M98,108 C90,106 84,112 84,120" fill="none" stroke="#1B2B2B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="84" cy="130" r="9" fill="#1B2B2B" fill-opacity="0.40" stroke="#1B2B2B" stroke-width="2.5"/>
</svg>
